<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FPS COLISION FIX REAL</title>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
body{margin:0;overflow:hidden;touch-action:none;}
canvas{display:block;}

#joyBase{
  position:fixed;
  bottom:40px;
  left:40px;
  width:130px;
  height:130px;
  border-radius:50%;

  /* base metálica */
  background:
    radial-gradient(circle at 30% 30%, #666, #2b2b2b 60%, #111),
    repeating-linear-gradient(
      45deg,
      rgba(255,255,255,0.05) 0px,
      rgba(255,255,255,0.05) 2px,
      transparent 2px,
      transparent 6px
    );

  box-shadow:
    inset -8px -8px 15px rgba(0,0,0,0.8),
    inset 6px 6px 12px rgba(255,255,255,0.15),
    0 0 10px rgba(0,0,0,0.8);

  border:1px solid rgba(255,255,255,0.15);
  overflow:hidden;
}

/* rayones */
#joyBase::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      120deg,
      transparent 0px,
      transparent 8px,
      rgba(255,255,255,0.05) 9px,
      transparent 10px
    );
  opacity:0.4;
}
#joyBase {
  position: fixed;
  bottom: 40px;
  left: 40px;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  
  background: transparent;
  border: 2px solid white;
  
  box-shadow:
    0 0 8px rgba(255, 255, 255, 0.3),
    inset 0 0 8px rgba(255, 255, 255, 0.2);
}
#joyStick{
  position:absolute;
  width:55px;
  height:55px;
  border-radius:50%;

  background:transparent;
  border:2px solid white;

  left:37px;
  top:37px;

  box-shadow:
    0 0 6px rgba(255,255,255,0.4),
    inset 0 0 6px rgba(255,255,255,0.2);
}
#lookZone{
  position:fixed;right:0;top:0;
  width:70%;height:100%;
}
#loadingScreen {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 99999;
  overflow: hidden;
}

#loadingImg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* SOLO salida */
@keyframes fadeOut {
  to {
    opacity: 0;
  }
}
#fsBtn{
  position:fixed;
  top:10px;
  right:10px;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  color:white;
  background:rgba(0,0,0,0.5);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:8px;
  z-index:1000;
  user-select:none;
}

#fsBtn:active{
  transform:scale(0.95);
}
</style>
</head>

<body>
<div id="fps" style="
position:fixed;
top:10px;
left:10px;
color:white;
font-family:monospace;
font-size:14px;
background:rgba(0,0,0,0.5);
padding:5px;
z-index:9999;
">
  FPS: --
</div>
<div id="loadingScreen">
  <img id="loadingImg" src="texturas/cargando.png">
</div>
</div>
<div id="fsBtn">⛶</div>
<div id="joyBase"><div id="joyStick"></div></div>
<div id="lookZone"></div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* SCENE */
const scene = new THREE.Scene();
const texture = new THREE.TextureLoader().load("texturas/dia.jpg");
texture.mapping = THREE.EquirectangularReflectionMapping;

scene.background = texture;
const ambientLight = new THREE.AmbientLight(0xffc04d, 5);
scene.add(ambientLight);

const impactLightGreen = new THREE.PointLight(0x00ff00, 100, 1000);

impactLightGreen.position.set(
  -66.8376378713303,
  -4.773301826863653,
  -8.828430541170816
);

scene.add(impactLightGreen);
const flickerLight = new THREE.PointLight(0xffffff, 80, 1000);

flickerLight.position.set(
  -23.957911620833947,
  -1.9232367782990718,
  -38.07161293749572
);

scene.add(flickerLight);

// 💡 efecto fallo / parpadeo
setInterval(() => {
  flickerLight.intensity = Math.random() > 0.5 ? 80 : 0;
}, 120);
/* CAMERA */
const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);

/* RENDER */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
let enemy;
let enemyIdle, enemyWalk;
let lastEnemyPosCheck = new THREE.Vector3();
let stuckTime = 0;
let isStuck = false;
let enemyState = "idle";
let currentAction = null;
let detectRange = 8;
let enemySpeed = 0.04;
let enemyMixer;
let enemyActions = {};

let enemyReady = false;
const waypoints = [
  new THREE.Vector3(-28, -10, 8),
  new THREE.Vector3(-6, -10, 25),
new THREE.Vector3(-28, -10, 8),
new THREE.Vector3(-47, -10, 28),
  new THREE.Vector3(-51, -10, 13),
  new THREE.Vector3(-47, -10, 28),
    new THREE.Vector3(-28, -10, 8),
    new THREE.Vector3(-39, -10, 1),
    new THREE.Vector3(-28, -10, 8),
    new THREE.Vector3(-6, -10, 25),
    new THREE.Vector3(-1, -10, 1),
    new THREE.Vector3(-26, -10, -20),
    new THREE.Vector3(-37, -10, 0),
];

let currentWP = 0;
let waitTimer = 0;
let waiting = false;
const fsBtn = document.getElementById("fsBtn");

fsBtn.addEventListener("click", () => {
  const el = document.documentElement;

  if (!document.fullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.msRequestFullscreen) el.msRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
});
/* PLAYER */
const player = new THREE.Vector3(-25.73,-10,-1.12);
const size = 0.4;

/* COLLISION MESHES */
const colliders = [];

/* ================= ZIP MAP ================= */
fetch("texturas/fnaf_movie_pizzaria_inside.zip")
  .then(res => {
    console.log("STATUS:", res.status);
    return res.arrayBuffer();
  })
  .then(data => JSZip.loadAsync(data))
  .then(zip => {
    
    let gltfFile;
    const files = {};
    const promises = [];
    
    zip.forEach((path, file) => {
      promises.push(
        file.async("blob").then(content => {
          files[path] = URL.createObjectURL(content);
          
          if (path.endsWith(".gltf")) {
            gltfFile = path;
          }
        })
      );
    });
    
    return Promise.all(promises).then(() => ({ files, gltfFile }));
  })
  .then(({ files, gltfFile }) => {
    
    const manager = new THREE.LoadingManager();
    
    manager.setURLModifier((url) => {
      
      if (files[url]) return files[url];
      
      let clean = url.replace(/^textures\//, "");
      if (files[clean]) return files[clean];
      
      clean = url.replace(/^(\.\/|\/)/, "");
      if (files[clean]) return files[clean];
      
      const fileName = url.split("/").pop();
      for (let key in files) {
        if (key.endsWith(fileName)) {
          return files[key];
        }
      }
      
      return url;
    });
    
    const loader = new GLTFLoader(manager);
    
    loader.load(files[gltfFile], (gltf) => {
      
      // 🔥 MISMO TAMAÑO QUE COLISIONES (3,3,3)
      gltf.scene.scale.set(3, 3, 3);
      
      scene.add(gltf.scene);
      mapDone = true;
      checkReady();
    });
    
  });
const enemyLoader = new GLTFLoader();

enemyLoader.load("texturas/enemigo_quieto.gltf", (gltf) => {
  
  enemyIdle = gltf.scene;
  enemyIdle.scale.set(3, 3, 3);
  
  // 🎬 animaciones idle
  const idleClips = gltf.animations;
  
  enemyLoader.load("texturas/enemigo_caminando.gltf", (gltf2) => {
    
    enemyWalk = gltf2.scene;
    enemyWalk.scale.set(3, 3, 3);
    
    const walkClips = gltf2.animations;
    
    enemy = enemyIdle;
    scene.add(enemy);
    enemy.position.set(
  -47.517139117111135,
  -10.572744890149691,
  30.47546717848566
);
    
    // 🎬 MIXER (usa el modelo actual)
    enemyMixer = new THREE.AnimationMixer(enemy);

// guardar animaciones
if (idleClips.length > 0) {
  enemyActions.idle = enemyMixer.clipAction(idleClips[0]);
}

if (walkClips.length > 0) {
  enemyActions.walk = enemyMixer.clipAction(walkClips[0]);
}

// 🔥 VELOCIDAD DE ANIMACIÓN
if (enemyActions.idle) enemyActions.idle.timeScale = 1.5;
if (enemyActions.walk) enemyActions.walk.timeScale = 2.0;

// ▶️ iniciar idle
currentAction = enemyActions.idle;
if (currentAction) currentAction.play();
    enemyReady = true;
    
  });
  
});
/* ================= COLLISION ================= */
const colLoader = new GLTFLoader();

colLoader.load("texturas/colisiones_update.gltf", (gltf) => {
  
  gltf.scene.scale.set(3, 3, 3);
  scene.add(gltf.scene);
  
  gltf.scene.traverse(o => {
    if (o.isMesh) {
      
      o.castShadow = true;
      o.receiveShadow = true;
      
      if (o.material) {
        o.material.roughness = 0;
        o.material.metalness = 0;
      }
      
      // 🔥 colisión invisible pero existente
      o.material = o.material.clone();
      o.material.transparent = true;
      o.material.opacity = 0.0;
      o.material.color.set(0xff0000);
      
      colliders.push(o);
    }
  });
  
  colDone = true;
  checkReady();
});

/* ================= JOYSTICK ================= */
let joyX = 0, joyY = 0;
let joyTouchId = null;

const base = document.getElementById("joyBase");
const stick = document.getElementById("joyStick");

base.addEventListener("touchstart", (e) => {
  for (let t of e.changedTouches) {
    if (joyTouchId === null) {
      joyTouchId = t.identifier;
    }
  }
});

base.addEventListener("touchmove", (e) => {
  for (let t of e.changedTouches) {
    if (t.identifier === joyTouchId) {

      const r = base.getBoundingClientRect();

      joyX = Math.max(-1, Math.min(1, (t.clientX - r.left - 65) / 65));
      joyY = Math.max(-1, Math.min(1, (t.clientY - r.top - 65) / 65));

      stick.style.left = (65 + joyX * 35 - 27) + "px";
      stick.style.top  = (65 + joyY * 35 - 27) + "px";
    }
  }
});

base.addEventListener("touchend", (e) => {
  for (let t of e.changedTouches) {
    if (t.identifier === joyTouchId) {
      joyTouchId = null;
      joyX = 0;
      joyY = 0;

      stick.style.left = "37px";
      stick.style.top  = "37px";
    }
  }
});
/* ================= LOOK ================= */
let yaw = 0, pitch = 0;
let lookTouchId = null;
let lastX = 0, lastY = 0;

const lookZone = document.getElementById("lookZone");

lookZone.addEventListener("touchstart", (e) => {
  for (let t of e.changedTouches) {
    if (lookTouchId === null) {
      lookTouchId = t.identifier;
      lastX = t.clientX;
      lastY = t.clientY;
    }
  }
});

lookZone.addEventListener("touchmove", (e) => {
  for (let t of e.changedTouches) {
    if (t.identifier === lookTouchId) {

      const dx = t.clientX - lastX;
      const dy = t.clientY - lastY;

      yaw   -= dx * 0.0035;
      pitch -= dy * 0.0035;

      pitch = Math.max(-1.2, Math.min(1.2, pitch));

      lastX = t.clientX;
      lastY = t.clientY;
    }
  }
});

lookZone.addEventListener("touchend", (e) => {
  for (let t of e.changedTouches) {
    if (t.identifier === lookTouchId) {
      lookTouchId = null;
    }
  }
});
function setEnemyAnim(state) {
  
  const next =
    state === "walk" ?
    enemyActions.walk :
    enemyActions.idle;
  
  if (!next || currentAction === next) return;
  
  currentAction?.fadeOut(0.2);
  
  currentAction = next;
  currentAction.reset().fadeIn(0.2).play();
}
let lastEnemyPos = new THREE.Vector3();

function updateEnemyAnimByMovement() {

  if (!enemy || !enemyActions) return;

  const moved = enemy.position.distanceTo(lastEnemyPos) > 0.001;

  if (moved) {
    setEnemyAnim("walk");
  } else {
    setEnemyAnim("idle");
  }

  lastEnemyPos.copy(enemy.position);
}
function updateEnemy(delta) {
  
  if (!enemyReady) return;
  
  updateStuck(delta);
  
  const playerPos = new THREE.Vector3(player.x, 0, player.z);
  const dist = enemy.position.distanceTo(playerPos);
  
  if (dist < detectRange) {
    
    enemyState = "walk";
    
    const dir = getSteering(playerPos);
    
    enemy.position.add(dir.multiplyScalar(enemySpeed));
    
    const angle = Math.atan2(dir.x, dir.z);
    
    let diff = angle - enemy.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    
    enemy.rotation.y += diff * 0.12;
    
  } else {
    enemyState = "idle";
  }
}
/* ================= COLLISION CORE ================= */
const ray = new THREE.Raycaster();

function getHit(pos, dir) {
  ray.set(new THREE.Vector3(pos.x, pos.y+0.8, pos.z), dir);
  const hits = ray.intersectObjects(colliders, true);
  return hits.length ? hits[0] : null;
}
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let lastRayTime = 0;
let startX = 0;
let startY = 0;

const marker = new THREE.Mesh(
  new THREE.SphereGeometry(0.15, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0x00ff00 })
);
marker.visible = false;
scene.add(marker);

function shootRay(x, y) {

  const now = Date.now();

  // ⏱ cooldown de 5 segundos
  if (now - lastRayTime < 5000) return;
  lastRayTime = now;

  mouse.x = (x / innerWidth) * 2 - 1;
  mouse.y = -(y / innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(scene.children, true);

  if (hits.length > 0) {
    const p = hits[0].point;

    marker.position.copy(p);
    marker.visible = true;

    console.log("📍 Impacto:", p.x, p.y, p.z);
  }
}
window.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  startX = t.clientX;
  startY = t.clientY;
});

window.addEventListener("touchend", (e) => {
  const t = e.changedTouches[0];

  const dx = Math.abs(t.clientX - startX);
  const dy = Math.abs(t.clientY - startY);

  // 🖱️ CLICK (pequeño movimiento)
  if (dx < 10 && dy < 10) {
    shootRay(t.clientX, t.clientY);
  }

  // 👆 swipe ignorado automáticamente
});
let lastTime = performance.now();
let frames = 0;
let fps = 0;

const fpsDiv = document.getElementById("fps");

const loadingScreen = document.getElementById("loadingScreen");
const clickImg = document.getElementById("clickImg");

let mapDone = false;
let colDone = false;

function checkReady() {
  if (mapDone && colDone) {
    setTimeout(() => {
      
      // cambiar imagen sin animación
      loadingImg.src = "texturas/click.png";
      
      loadingScreen.addEventListener("click", startGame, { once: true });
      loadingScreen.addEventListener("touchstart", startGame, { once: true });
      
    }, 3000);
  }
}
function startGame() {
  
  try {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
  } catch (e) {}
  
  // fade limpio
  loadingImg.style.animation = "fadeOut 0.4s ease forwards";
  
  setTimeout(() => {
    loadingScreen.style.display = "none";
  }, 400);
}
function patrolWaypoints() {
  if (!enemy || enemyState === "walk") return;
  
  const target = waypoints[currentWP];
  if (!target) return;
  
  const dirToTarget = new THREE.Vector3(
    target.x - enemy.position.x,
    0,
    target.z - enemy.position.z
  );
  
  const distance = dirToTarget.length();
  
  const speed = 0.07;
  
  if (distance < 0.5) {
    
    setEnemyAnim("idle");
    
    waiting = true;
    waitTimer += 0.016;
    
    if (waitTimer > 2) {
      waitTimer = 0;
      waiting = false;
      
      currentWP++;
      if (currentWP >= waypoints.length) currentWP = 0;
    }
    
    return;
  }
  
  if (!waiting) {
    
    setEnemyAnim("walk");
    
    // 🔥 usar cerebro inteligente
    const moveDir = getSteering(target);
    enemy.position.add(moveDir.multiplyScalar(speed));
    
    // rotación
    const angle = Math.atan2(moveDir.x, moveDir.z);
    
    let diff = angle - enemy.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    
    enemy.rotation.y += diff * 0.08;
  }
}
function getSteeringDirection(targetPos) {

  const toTarget = new THREE.Vector3(
    targetPos.x - enemy.position.x,
    0,
    targetPos.z - enemy.position.z
  );

  toTarget.normalize();

  // 📡 radar
  const avoidForce = new THREE.Vector3();
  const rays = 16;
  const safeDist = 1.5;

  for (let i = 0; i < rays; i++) {

    const angle = (i / rays) * Math.PI * 2;

    const dir = new THREE.Vector3(
      Math.sin(angle),
      0,
      Math.cos(angle)
    );

    const hit = getHit(enemy.position, dir);

    if (hit && hit.distance < safeDist) {

      const strength = (safeDist - hit.distance) / safeDist;

      avoidForce.add(
        dir.clone().negate().multiplyScalar(strength)
      );
    }
  }

  avoidForce.y = 0;

  // mezcla
  const finalDir = new THREE.Vector3();

  finalDir.add(avoidForce.multiplyScalar(3.5)); // evade fuerte
  finalDir.add(toTarget.multiplyScalar(1.0));   // objetivo débil

  return finalDir.normalize();
}
function getSteering(targetPos) {
  
  const toTarget = new THREE.Vector3(
    targetPos.x - enemy.position.x,
    0,
    targetPos.z - enemy.position.z
  );
  
  toTarget.normalize();
  
  const avoidForce = new THREE.Vector3();
  
  const rays = 12;
  const safeDist = 1.3;
  
  for (let i = 0; i < rays; i++) {
    
    const angle = (i / rays) * Math.PI * 2;
    
    const dir = new THREE.Vector3(
      Math.sin(angle),
      0,
      Math.cos(angle)
    );
    
    const hit = getHit(enemy.position, dir);
    
    if (hit && hit.distance < safeDist) {
      
      const strength = (safeDist - hit.distance) / safeDist;
      
      avoidForce.add(
        dir.clone().negate().multiplyScalar(strength)
      );
    }
  }
  
  avoidForce.y = 0;
  
  const finalDir = new THREE.Vector3();
  
  // 🔥 SIEMPRE perseguir
  finalDir.add(toTarget.multiplyScalar(2.0));
  
  // evitar pero sin cancelar persecución
  finalDir.add(avoidForce.multiplyScalar(2.5));
  
  // 🔥 SI ESTÁ ATASCADO → FORZAR SALIDA
  if (isStuck) {
    const escape = avoidForce.length() > 0 ?
      avoidForce.clone() :
      toTarget.clone().negate(); // retrocede si no hay info
    
    finalDir.copy(escape.multiplyScalar(3.5));
  }
  
  if (finalDir.length() < 0.01) {
    finalDir.copy(toTarget);
  }
  
  return finalDir.normalize();
}
function updateStuck(delta) {

  const moved = enemy.position.distanceTo(lastEnemyPosCheck);

  if (moved < 0.01) {
    stuckTime += delta;
  } else {
    stuckTime = 0;
    isStuck = false;
  }

  if (stuckTime > 0.5) {
    isStuck = true;
  }

  lastEnemyPosCheck.copy(enemy.position);
}
/* ================= LOOP ================= */
const speed = 0.12;

function animate(){
  frames++;

const now = performance.now();
const delta = now - lastTime;

if (delta >= 1000) {
  fps = Math.round((frames * 1000) / delta);
  frames = 0;
  lastTime = now;
  
  fpsDiv.textContent = "FPS: " + fps;
}
  requestAnimationFrame(animate);

  let forward = new THREE.Vector3(0,0,-1)
    .applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

  let right = new THREE.Vector3()
    .crossVectors(forward,new THREE.Vector3(0,1,0));

  let move = new THREE.Vector3();
  move.addScaledVector(forward, joyY);
  move.addScaledVector(right, -joyX);

  if(move.length()>0) move.normalize();

  let velocity = move.clone().multiplyScalar(speed);
  let hit = getHit(player, velocity.clone().normalize());

  const skin = 0.15;

  if(!hit || hit.distance > size + skin){
    player.add(velocity);
  }else{
    let normal = hit.face.normal.clone()
      .transformDirection(hit.object.matrixWorld)
      .normalize();

    if(Math.abs(normal.y) > 0.6){
      player.add(velocity);
    }else{
      let intoWall = velocity.dot(normal);
      if(intoWall < 0){
        let slide = velocity.clone().sub(
          normal.multiplyScalar(intoWall)
        );
        player.add(slide);
      }
    }
  }

  camera.position.set(player.x,player.y+1.2,player.z);

  const dir = new THREE.Vector3(
    Math.sin(yaw)*Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw)*Math.cos(pitch)
  );
  const deltaTime = 0.016; 
  updateEnemy(deltaTime);// simple (luego lo mejoramos)
if(enemyMixer) enemyMixer.update(deltaTime);
updateEnemy();


if (enemyState === "idle") {
  patrolWaypoints();
}
if (waiting) {
  enemyState = "idle";
} else {
  enemyState = "walk";
}

  camera.lookAt(camera.position.clone().add(dir));

  renderer.render(scene,camera);
}

animate();

/* RESIZE */
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
