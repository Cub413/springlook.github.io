<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FPS COLISION FIX REAL</title>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
body{margin:0;overflow:hidden;touch-action:none;}
canvas{display:block;}

#joyBase{
  position:fixed; bottom:40px; left:40px;
  width:130px; height:130px;
  border-radius:50%;
  background:rgba(255,255,255,0.08);
}
#joyStick{
  position:absolute;
  width:55px;height:55px;
  border-radius:50%;
  background:rgba(255,255,255,0.4);
  left:37px;top:37px;
}

#lookZone{
  position:fixed;right:0;top:0;
  width:70%;height:100%;
}
</style>
</head>

<body>

<div id="joyBase"><div id="joyStick"></div></div>
<div id="lookZone"></div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.TextureLoader().load("texturas/dia.jpg");

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const sun = new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(10,20,10);
scene.add(sun);

/* CAMERA */
const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);

/* RENDER */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* PLAYER */
const player = new THREE.Vector3(-25.73,-10,-1.12);
const size = 0.4;

/* COLLISION MESHES */
const colliders = [];

/* ================= ZIP MAP ================= */
fetch("texturas/fnaf_movie_pizzaria_inside.zip")
  .then(res => {
    console.log("STATUS:", res.status);
    return res.arrayBuffer();
  })
.then(data => JSZip.loadAsync(data))
.then(zip => {

  let gltfFile;
  const files = {};
  const promises = [];

  zip.forEach((path, file) => {
    promises.push(
      file.async("blob").then(content => {
        files[path] = URL.createObjectURL(content);

        if (path.endsWith(".gltf")) {
          gltfFile = path;
        }
      })
    );
  });

  return Promise.all(promises).then(() => ({ files, gltfFile }));
})
.then(({ files, gltfFile }) => {

  const manager = new THREE.LoadingManager();

  manager.setURLModifier((url) => {
  
  // intento directo
  if (files[url]) return files[url];
  
  // quitar "textures/"
  let clean = url.replace(/^textures\//, "");
  if (files[clean]) return files[clean];
  
  // quitar rutas tipo ./ o /
  clean = url.replace(/^(\.\/|\/)/, "");
  if (files[clean]) return files[clean];
  
  // fallback: buscar por nombre
  const fileName = url.split("/").pop();
  for (let key in files) {
    if (key.endsWith(fileName)) {
      return files[key];
    }
  }
  
  return url;
});

  const loader = new GLTFLoader(manager);

  loader.load(files[gltfFile], (gltf) => {
    gltf.scene.scale.set(3,3,3);
    scene.add(gltf.scene);
  });

});

/* ================= COLLISION ================= */
const colLoader = new GLTFLoader();

colLoader.load("texturas/colisiones_update.gltf",(gltf)=>{

  gltf.scene.scale.set(3,3,3);
  scene.add(gltf.scene);

  gltf.scene.traverse(o=>{
    if(o.isMesh){

      o.material = o.material.clone();
      o.material.transparent = true;
      o.material.opacity = 0.10;
      o.material.color.set(0xff0000);

      colliders.push(o);
    }
  });
});

/* ================= JOYSTICK ================= */
let joyX=0,joyY=0,drag=false;
const base=document.getElementById("joyBase");
const stick=document.getElementById("joyStick");

base.addEventListener("touchstart",()=>drag=true);

base.addEventListener("touchmove",e=>{
  if(!drag)return;
  const t=e.touches[0];
  const r=base.getBoundingClientRect();

  joyX=Math.max(-1,Math.min(1,(t.clientX-r.left-65)/65));
  joyY=Math.max(-1,Math.min(1,(t.clientY-r.top-65)/65));

  stick.style.left=(65+joyX*35-27)+"px";
  stick.style.top=(65+joyY*35-27)+"px";
});

base.addEventListener("touchend",()=>{
  drag=false;
  joyX=0;joyY=0;
});

/* ================= LOOK ================= */
let yaw=0,pitch=0,last=null;

document.getElementById("lookZone").addEventListener("touchstart",e=>{
  last=e.touches[0];
});

document.getElementById("lookZone").addEventListener("touchmove",e=>{
  if(!last)return;
  const t=e.touches[0];

  yaw   -= (t.clientX-last.clientX)*0.0015;
  pitch -= (t.clientY-last.clientY)*0.0015;

  pitch=Math.max(-1.2,Math.min(1.2,pitch));
  last=t;
});

/* ================= COLLISION CORE ================= */
const ray = new THREE.Raycaster();

function getHit(pos, dir) {
  ray.set(new THREE.Vector3(pos.x, pos.y+0.8, pos.z), dir);
  const hits = ray.intersectObjects(colliders, true);
  return hits.length ? hits[0] : null;
}

/* ================= LOOP ================= */
const speed = 0.12;

function animate(){
  requestAnimationFrame(animate);

  let forward = new THREE.Vector3(0,0,-1)
    .applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

  let right = new THREE.Vector3()
    .crossVectors(forward,new THREE.Vector3(0,1,0));

  let move = new THREE.Vector3();
  move.addScaledVector(forward, joyY);
  move.addScaledVector(right, -joyX);

  if(move.length()>0) move.normalize();

  let velocity = move.clone().multiplyScalar(speed);
  let hit = getHit(player, velocity.clone().normalize());

  const skin = 0.15;

  if(!hit || hit.distance > size + skin){
    player.add(velocity);
  }else{
    let normal = hit.face.normal.clone()
      .transformDirection(hit.object.matrixWorld)
      .normalize();

    if(Math.abs(normal.y) > 0.6){
      player.add(velocity);
    }else{
      let intoWall = velocity.dot(normal);
      if(intoWall < 0){
        let slide = velocity.clone().sub(
          normal.multiplyScalar(intoWall)
        );
        player.add(slide);
      }
    }
  }

  camera.position.set(player.x,player.y+1.2,player.z);

  const dir = new THREE.Vector3(
    Math.sin(yaw)*Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw)*Math.cos(pitch)
  );

  camera.lookAt(camera.position.clone().add(dir));

  renderer.render(scene,camera);
}

animate();

/* RESIZE */
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
