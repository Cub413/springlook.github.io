<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orientación</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#000;
}

/* 🔥 Fondo blur */
#bg{
  position:fixed;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:blur(20px);
  transform:scale(1.2); /* evita bordes */
  z-index:0;
  display:none;
}

/* 🔥 Imagen principal */
#screenImg{
  position:fixed;
  inset:0;
  margin:auto;
  z-index:1;
  cursor:pointer;
}

/* 📱 Vertical */
.vertical #bg{
  display:block;
}

.vertical #screenImg{
  width:100%;
  height:100%;
  object-fit:contain;
  cursor:default;
}

/* 🖥️ Horizontal */
.horizontal #screenImg{
  width:100%;
  height:100%;
  object-fit:cover;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="bg"></div>
<img id="screenImg" src="">

<script>
const img = document.getElementById("screenImg");
const bg = document.getElementById("bg");

function checkOrientation() {
  if (window.innerHeight > window.innerWidth) {
    // 📱 Vertical
    document.body.classList.add("vertical");
    document.body.classList.remove("horizontal");

    img.src = "texturas/rota.png";
    bg.style.backgroundImage = 'url("texturas/rota.png")';

    img.onclick = null;

  } else {
    // 🖥️ Horizontal
    document.body.classList.add("horizontal");
    document.body.classList.remove("vertical");

    img.src = "texturas/click.png";
    bg.style.backgroundImage = "none";

    img.onclick = () => {
      window.location.href = "game.html";
    };
  }
}

checkOrientation();
window.addEventListener("resize", checkOrientation);
window.addEventListener("orientationchange", checkOrientation);
</script>

</body>
</html>
